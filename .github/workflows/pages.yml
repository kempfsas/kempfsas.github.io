name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Seiten aus content/*.md neu erzeugen, damit immer der Markdown-Stand
      # online geht - auch wenn build.py lokal nicht gelaufen ist.
      - name: Seiten aus Markdown erzeugen
        run: python3 build.py

      # Nur die Portfolio-Dateien veroeffentlichen.
      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp index.html 404.html .nojekyll _site/
          cp -r assets work blog _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
