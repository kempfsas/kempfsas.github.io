server {
    listen       8080;
    server_name  localhost;
    root         /usr/share/nginx/html;
    index        index.html;

    charset utf-8;
    absolute_redirect off;

    # index.html und 404.html werden aus dem Repo-Ordner (/src) gelesen, nicht
    # ueber einen Einzeldatei-Mount. Ein Bind-Mount auf eine einzelne Datei haengt
    # an deren Inode: schreibt build.py die Datei neu, liefert der Container
    # weiterhin die alte Fassung aus - ohne jeden Hinweis. Ordner-Mounts haben
    # das Problem nicht, darum kommt alles aus Ordnern.
    # /src ist nur ueber diese drei exakten Pfade erreichbar; material/ und .git/
    # bleiben damit unzugaenglich.
    location = / {
        root /src;
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    location = /index.html {
        root /src;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    location = /404.html {
        root /src;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Unterseiten: /work/google-ads findet auch /work/google-ads.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # HTML nie zwischenspeichern, damit Aenderungen sofort sichtbar sind.
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Statische Dateien kurz cachen - sonst zieht jeder Reload auch Fonts,
    # Bilder und Videos neu und die Seite wirkt langsamer, als sie ist.
    # Der Inhalts-Hash in der URL (style.css?v=...) sorgt dafuer, dass
    # Aenderungen trotzdem sofort ankommen.
    location ~* \.(css|js|jpg|jpeg|png|svg|woff2|mp4|pdf)$ {
        add_header Cache-Control "public, max-age=60";
    }

    error_page 404 /404.html;

    gzip on;
    # Video und JPEG sind bereits komprimiert - nicht nochmal durch gzip.
    gzip_types text/css text/javascript application/json image/svg+xml;
}
